<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874F0" />
      <stop offset="100%" stop-color="#1254E7" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2B66" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Container Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shopping Bag Icon -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M192 190 C192 120, 320 120, 320 190" 
          fill="none" 
          stroke="url(#handleGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Bag Body -->
    <path d="M136 190 L376 190 C392 190, 404 204, 400 220 L378 400 C375 422, 356 438, 334 438 L178 438 C156 438, 137 422, 134 400 L112 220 C108 204, 120 190, 136 190 Z" 
          fill="url(#bagGrad)" />

    <!-- Stylized 'm' brand mark inside bag -->
    <path d="M 190 380 L 190 280 C 190 255, 230 255, 256 285 C 282 255, 322 255, 322 280 L 322 380" 
          fill="none" 
          stroke="#1254E7" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Yellow Accent Dot -->
    <circle cx="256" cy="355" r="16" fill="url(#handleGrad)" />
  </g>
</svg>